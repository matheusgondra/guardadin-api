api:
  jwt:
    secret: ${JWT_SECRET:secretKey}

logging:
  level:
    root: INFO
    com.matheusgondra.guardadin: ${LOG_LEVEL:INFO}

springdoc:
  api-docs:
    path: /api-docs

scalar:
  path: /api/docs
  theme: blue-planet
  dark-mode: true
  page-title: GuardaDin API

server:
  port: ${PORT:8080}

spring:
  application:
    name: guarda-din-api
  web:
    error:
      include-stacktrace: never
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guardadin_db}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate