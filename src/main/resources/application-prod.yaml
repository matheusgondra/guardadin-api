api:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.matheusgondra.guardadin: ${LOG_LEVEL:INFO}

springdoc:
  api-docs:
    path: /api-docs

scalar:
  path: /api/docs
  theme: blue-planet
  dark-mode: true
  page-title: GuardaDin API

server:
  port: ${PORT:8080}

spring:
  application:
    name: guarda-din-api
  web:
    error:
      include-stacktrace: never
  output:
    ansi:
      enabled: NEVER
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate